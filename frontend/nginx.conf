server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS server. Used below to re-resolve the
    # "backend" hostname on every request instead of once at nginx
    # startup — without this, a literal hostname in proxy_pass gets
    # resolved once and cached for the life of the worker process, so
    # if the backend container ever restarts (and gets a new IP),
    # nginx keeps trying the old, dead IP and every request 502s.
    resolver 127.0.0.11 valid=10s;

    # Reverse-proxy API calls to the backend container. The frontend
    # calls relative /api/... URLs in production (see
    # environment.prod.ts), so from the browser's point of view this
    # is all one origin — no CORS needed.
    location /api/ {
        # A variable (rather than a literal hostname) here is what
        # forces nginx to use the resolver above per-request.
        set $backend_upstream backend:8080;
        proxy_pass http://$backend_upstream/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Everything else: serve the Angular app. try_files falls back to
    # index.html for any path that isn't a real file, so client-side
    # routes (e.g. a direct visit/refresh on /recipes) still work.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
