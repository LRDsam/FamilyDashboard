server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Reverse-proxy API calls to the backend container. The frontend
    # calls relative /api/... URLs in production (see
    # environment.prod.ts), so from the browser's point of view this
    # is all one origin — no CORS needed.
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Everything else: serve the Angular app. try_files falls back to
    # index.html for any path that isn't a real file, so client-side
    # routes (e.g. a direct visit/refresh on /recipes) still work.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
